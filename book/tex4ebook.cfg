\Preamble{xhtml,fn-in}
% fn-in keeps each footnote at the end of its chapter, linked both ways, as on
% the website. Without it every footnote became a page of its own that nothing
% linked back to, and Kindle's quality review flags that: "Footnotes not
% backlinked".
% Tells the book it is being made into the ebook, not the website: the ebook
% gets the note on asking this book (cover/cover.tex, cover/ask-this-book.tex),
% the website leaves it out.
\def\sdfebook{}
\renewcommand\listofflowcharts{%
\chapter*{\listoflocname}%
\TableOfContents[loc]%
}
\ConfigureToc{loc}{\HCode{<span class="lofToc">}}{\ }{}{\HCode{</span><br />}}
\begin{document}
\Configure{DocumentLanguage}{en}
\Configure{OpfScheme}{URI}
\Configure{UniqueIdentifier}{https://the-bread-code.io}
\Configure{AddCss}{book-ebook.css}
\Configure{CoverMimeType}{image/jpeg}
\CoverMetadata{cover/cover-page.jpg}
\AddToHook{env/tikzpicture/begin}{\fontfamily{opensans-TLF}\selectfont}
% dvisvgm crops every TikZ picture to its bounding box, and TikZ leaves the
% line width out of that box. The 2 mm outline of the decision diamonds stuck
% out and lost its tips (Flowchart 3.1, "Ready?"), and 13 of the book's 23
% drawings lost a stroke somewhere. A little room around every picture keeps
% the strokes whole. The printed book does not read this file.
\tikzset{every picture/.append style={execute at end picture={%
  \path (current bounding box.south west) +(-1.5mm,-1.5mm)
        (current bounding box.north east) +(1.5mm,1.5mm);}}}
\Configure{@HEAD}{\HCode{
<style type="text/css">
  @import url('https://fonts.cdnfonts.com/css/open-sans');
  body{
    font-family: 'Open Sans';
  }
</style>}}
\EndPreamble
